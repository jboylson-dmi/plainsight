<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>plainsight</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256' style='color:%237aa2cf'%3E%3Cpolygon points='152 32 152 88 208 88 152 32' opacity='0.2'/%3E%3Cpath d='M208,224V88L152,32H56a8,8,0,0,0-8,8v72' fill='none' stroke='currentColor' stroke-linecap='round' stroke-linejoin='round' stroke-width='16'/%3E%3Cpolyline points='152 32 152 88 208 88' fill='none' stroke='currentColor' stroke-linecap='round' stroke-linejoin='round' stroke-width='16'/%3E%3Cpath d='M128,152v56h16a28,28,0,0,0,0-56Z' fill='none' stroke='currentColor' stroke-linecap='round' stroke-linejoin='round' stroke-width='16'/%3E%3Cpolyline points='96 208 96 152 68 192 40 152 40 208' fill='none' stroke='currentColor' stroke-linecap='round' stroke-linejoin='round' stroke-width='16'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: dark;
    --bg:      #1e2024;  /* app background — soft dark gray, not black */
    --surface: #26292e;  /* header / inputs / code blocks */
    --text:    #c9ccd1;  /* body text — light gray, not white */
    --muted:   #8a8f98;  /* secondary text */
    --border:  #3a3e44;
    --accent:  #7aa2cf;  /* muted blue for links */
    --error:   #cf8a8a;
  }
  * { box-sizing: border-box; }
  html, body { overscroll-behavior: none; }
  body {
    margin: 0; font: 15px/1.7 -apple-system, system-ui, sans-serif;
    background: var(--bg); color: var(--text);
  }
  header {
    position: sticky; top: 0; z-index: 10; display: flex; gap: 8px;
    padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  #path {
    flex: 1; padding: 8px 10px; font: 13px ui-monospace, monospace;
    border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text);
  }
  #path::placeholder { color: var(--muted); }
  button {
    padding: 8px 14px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--text); cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  main { max-width: 780px; margin: 0 auto; padding: 24px 20px 80px; }
  #status { padding: 6px 20px; color: var(--error); font-size: 13px; }
  a { color: var(--accent); }
  h1, h2, h3, h4 { color: #dfe2e6; }
  hr { border: none; border-top: 1px solid var(--border); }
  blockquote { margin: 1em 0; padding: 0 1em; color: var(--muted); border-left: 3px solid var(--border); }
  pre { overflow-x: auto; padding: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; }
  code { font-family: ui-monospace, monospace; }
  :not(pre) > code { background: var(--surface); padding: 1px 5px; border-radius: 4px; }
  table { border-collapse: collapse; }
  th, td { border: 1px solid var(--border); padding: 4px 8px; }
  th { background: var(--surface); }
  img { max-width: 100%; }
</style>
</head>
<body>
<header>
  <input id="path" placeholder="/Users/you/notes/file.md" spellcheck="false">
  <button id="go">Open</button>
  <button id="reload" title="Reload current file">↻</button>
</header>
<div id="status"></div>
<main id="content"></main>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
  const $path = document.getElementById('path');
  const $status = document.getElementById('status');
  const $content = document.getElementById('content');
  let currentPath = null;
  const scrollKey = p => 'plainsight:scroll:' + p;

  async function load(p) {
    p = (p || '').trim();
    if (!p) return;
    $status.textContent = 'Loading…';
    try {
      const res = await fetch('/raw?path=' + encodeURIComponent(p));
      const text = await res.text();
      if (!res.ok) { $status.textContent = text; return; }
      $status.textContent = '';
      $content.innerHTML = marked.parse(text);
      // Keep the reader where they were — survives a full browser refresh
      // because the position is stored per-file in localStorage.
      currentPath = p;
      const saved = parseInt(localStorage.getItem(scrollKey(p)) || '0', 10);
      requestAnimationFrame(() => window.scrollTo(0, saved));
      document.title = p.split('/').pop() + ' — plainsight';
      localStorage.setItem('plainsight:last', p);
      const u = new URL(location); u.searchParams.set('path', p);
      history.replaceState(null, '', u);
    } catch (e) {
      $status.textContent = 'Error: ' + e.message;
    }
  }

  // Remember scroll position per file as the reader scrolls.
  addEventListener('scroll', () => {
    if (currentPath) localStorage.setItem(scrollKey(currentPath), window.scrollY);
  }, { passive: true });

  document.getElementById('go').onclick = () => load($path.value);
  document.getElementById('reload').onclick = () => load($path.value);
  $path.addEventListener('keydown', e => { if (e.key === 'Enter') load($path.value); });

  // Open a path from ?path= or the last-viewed file on startup.
  const initial = new URL(location).searchParams.get('path')
    || localStorage.getItem('plainsight:last') || '';
  if (initial) { $path.value = initial; load(initial); }
</script>
</body>
</html>
